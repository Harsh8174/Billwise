<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard · BillWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">Bill<span>Wise</span></div>
    <nav class="nav-group">
      <a class="nav-link active" href="dashboard.html"><span class="nav-dot"></span>Dashboard</a>
      <a class="nav-link" href="invoices.html"><span class="nav-dot"></span>Invoices</a>
      <a class="nav-link" href="scheduled-jobs.html"><span class="nav-dot"></span>Scheduled Jobs</a>
    </nav>
    <div class="sidebar-foot">
      Signed in as Admin<br>
      <a href="#" id="logout-link" style="color:#e6b85c;">Sign out</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1>Dashboard</h1>
       <div class="subtitle" id="todayDate"></div>
      </div>
      <div class="topbar-right">
        <div class="avatar">AD</div>
      </div>
    </header>

    <div class="content">
      <div class="stat-row" id="stat-row">
        <div class="stat accent-total"><div class="num">—</div><div class="label">Total invoices</div></div>
        <div class="stat accent-due"><div class="num">—</div><div class="label">Due today</div></div>
        <div class="stat accent-due"><div class="num">—</div><div class="label">Due tomorrow</div></div>
        <div class="stat accent-overdue"><div class="num">—</div><div class="label">Overdue</div></div>
        <div class="stat accent-failed"><div class="num">—</div><div class="label">Failed reminders</div></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Recent job runs</h2>
          <a class="link" href="scheduled-jobs.html">View all jobs →</a>
        </div>
        <table>
          <thead>
            <tr>
              <th>Job</th>
              <th>Trigger</th>
              <th>Run time</th>
              <th class="num">Found</th>
              <th class="num">Sent</th>
              <th class="num">Skipped</th>
              <th class="num">Failed</th>
            </tr>
          </thead>
          <tbody id="runs-body">
            <tr><td colspan="7" class="table-empty">Loading recent runs…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Live backend: js/api.js talks to your Spring Boot REST API.
     Swap to js/mock-api.js instead if you want the clickable offline demo. -->
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  UI.requireAuth();
  UI.wireLogout("#logout-link");

 const today = new Date();

    const formattedDate = today.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("todayDate").textContent =
        "Today — " + formattedDate;



  async function render() {
    const stats = await window.BillWiseAPI.getDashboardStats();

    const statRow = document.getElementById("stat-row");
    statRow.innerHTML = `
      <div class="stat accent-total"><div class="num">${stats.totalInvoices}</div><div class="label">Total invoices</div></div>
      <div class="stat accent-due"><div class="num">${stats.dueToday}</div><div class="label">Due today</div></div>
      <div class="stat accent-due"><div class="num">${stats.dueTomorrow}</div><div class="label">Due tomorrow</div></div>
      <div class="stat accent-overdue"><div class="num">${stats.overdue}</div><div class="label">Overdue</div></div>
      <div class="stat accent-failed"><div class="num">${stats.failedReminders}</div><div class="label">Failed reminders</div></div>
    `;

    const runsBody = document.getElementById("runs-body");
    if (stats.recentRuns.length === 0) {
      runsBody.innerHTML = `<tr><td colspan="7" class="table-empty"><strong>No job runs yet</strong>Run a job manually from Scheduled Jobs to see it appear here.</td></tr>`;
      return;
    }
    runsBody.innerHTML = stats.recentRuns.map((r) => `
      <tr>
        <td>${UI.escapeHtml(r.jobName)}</td>
        <td class="text-muted">${r.trigger }</td>
        <td>${UI.formatDateTime(r.startedAt)}</td>
        <td class="num">${r.found}</td>
        <td class="num">${r.succeeded}</td>
        <td class="num">${r.skipped}</td>
        <td class="num">${r.failed}</td>
      </tr>
    `).join("");
  }

  render();
</script>
</body>
</html>
